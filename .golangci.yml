# Configuração do golangci-lint
# Ferramenta de análise de código para Go

run:
  timeout: 5m
  modules-download-mode: readonly

linters-settings:
  govet:
    check-shadowing: true
  
  gocyclo:
    min-complexity: 15
  
  dupl:
    threshold: 100
  
  goconst:
    min-len: 2
    min-occurrences: 2

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - misspell
    - gofmt
    - goimports

issues:
  # Excluir alguns arquivos ou diretórios da análise
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck