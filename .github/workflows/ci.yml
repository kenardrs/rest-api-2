# GitHub Actions Workflow para CI/CD
name: 🚀 CI/CD Pipeline

# Quando executar este workflow
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Permite executar manualmente
  workflow_dispatch:

# Variáveis de ambiente globais
env:
  GO_VERSION: '1.25'

# Jobs (trabalhos) que serão executados
jobs:
  # Job 1: Testes e verificações
  test:
    name: 🧪 Tests & Quality
    runs-on: ubuntu-latest
    
    steps:
    # 1. Fazer checkout do código
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necessário para git describe

    # 2. Configurar Go
    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    # 3. Cache das dependências
    - name: 📦 Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    # 4. Download das dependências
    - name: 📥 Download dependencies
      run: go mod download

    # 5. Verificar formato do código
    - name: 🔍 Check code format
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "❌ Code is not formatted properly"
          gofmt -s -l .
          exit 1
        fi
        echo "✅ Code is properly formatted"

    # 6. Lint (verificação de qualidade)
    - name: 🔍 Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        skip-cache: false

    # 7. Executar testes
    - name: 🧪 Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    # 8. Upload do coverage
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  # Job 2: Build multiplataforma
  build:
    name: 🔨 Build
    needs: test  # Só executa se os testes passarem
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Compilar para diferentes sistemas
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          # Windows ARM64 ainda não é muito comum
          - goos: windows
            goarch: arm64
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐹 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: 🔨 Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        # Criar nome do arquivo baseado no OS
        if [ "$GOOS" = "windows" ]; then
          BINARY_NAME="rest-api-2-$GOOS-$GOARCH.exe"
        else
          BINARY_NAME="rest-api-2-$GOOS-$GOARCH"
        fi
        
        # Obter informações de versão (igual ao Makefile)
        VERSION=$(git describe --tags --always --dirty)
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        GIT_COMMIT=$(git rev-parse HEAD)
        GO_VERSION=$(go version | awk '{print $3}')
        
        # Compilar com informações de versão
        go build -ldflags "\
          -X rest-api-2/internal/version.Version=$VERSION \
          -X rest-api-2/internal/version.BuildDate=$BUILD_DATE \
          -X rest-api-2/internal/version.GitCommit=$GIT_COMMIT \
          -X rest-api-2/internal/version.GoVersion=$GO_VERSION" \
          -o $BINARY_NAME cmd/api/main.go
        
        echo "✅ Built: $BINARY_NAME"

    # 9. Upload dos binários como artifacts
    - name: 📦 Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: rest-api-2-${{ matrix.goos }}-${{ matrix.goarch }}
        path: rest-api-2-*